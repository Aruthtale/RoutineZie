apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.routinezie.app"
    compileSdk rootProject.ext.compileSdkVersion

    // Signing: sumber tunggal = android/keystore.properties (tidak di git).
    // Prioritas: env ROUTINEZIE_* -> -P project property -> keystore.properties.
    // TIDAK ADA password hardcoded. Bila kredensial hilang, build rilis GAGAL
    // dengan pesan jelas — lebih baik daripada diam-diam menandatangani dengan
    // kunci lain (yang membuat update APK ditolak Android selamanya).
    signingConfigs {
        release {
            def envStore = System.getenv('ROUTINEZIE_KEYSTORE_FILE')
            def envAlias = System.getenv('ROUTINEZIE_KEY_ALIAS')
            def envKeyPass = System.getenv('ROUTINEZIE_KEY_PASSWORD')
            def envStorePass = System.getenv('ROUTINEZIE_KEYSTORE_PASSWORD')

            def propStore = project.findProperty('RoutineZieUploadKeystoreFile')
            def propAlias = project.findProperty('RoutineZieKeyAlias')
            def propKeyPass = project.findProperty('RoutineZieKeyPassword')
            def propStorePass = project.findProperty('RoutineZieKeystorePassword')

            def storePath = envStore ?: propStore ?: keystoreProperties['storeFile']
            def alias = envAlias ?: propAlias ?: keystoreProperties['keyAlias']
            def keyPass = envKeyPass ?: propKeyPass ?: keystoreProperties['keyPassword']
            def storePass = envStorePass ?: propStorePass ?: keystoreProperties['storePassword']

            def resolvedStore = storePath ? file(storePath) : null
            if (resolvedStore != null && !resolvedStore.isAbsolute()) {
                // storeFile relatif terhadap android/app/
                resolvedStore = file(storePath)
            }

            if (resolvedStore != null && resolvedStore.exists() && alias && keyPass && storePass) {
                keyAlias alias
                keyPassword keyPass
                storeFile resolvedStore
                storePassword storePass
            }
            // Bila tidak lengkap: signingConfigs.release dibiarkan kosong.
            // Tugas assembleRelease di bawah akan gagal dengan pesan yang jelas.
        }
    }

    defaultConfig {
        applicationId "com.routinezie.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 164
        versionName "1.6.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Gagal cepat bila kredensial rilis tidak lengkap — mencegah APK tak
    // bertanda tangan atau bertanda kunci salah lolos tanpa sadar.
    tasks.configureEach { task ->
        if (task.name in ['assembleRelease', 'bundleRelease', 'packageRelease']) {
            task.doFirst {
                if (!android.signingConfigs.release.storeFile
                        || !android.signingConfigs.release.keyAlias
                        || !android.signingConfigs.release.storePassword
                        || !android.signingConfigs.release.keyPassword) {
                    throw new GradleException(
                        "Kredensial rilis tidak lengkap. Sediakan android/keystore.properties " +
                        "(storeFile, storePassword, keyAlias, keyPassword) atau env ROUTINEZIE_*. " +
                        "Lihat Arsitecture/KEYS.md untuk prosedur pemulihan.")
                }
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
